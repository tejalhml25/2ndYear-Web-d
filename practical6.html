<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CM25060, TejalHedau</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-300 min-h-screen flex items-center justify-center p-4">

    <div class="bg-blue-100 rounded-xl shadow-md p-6 sm:p-8 w-full max-w-md">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">
            Practical Grade Calculator
        </h1>

        <div class="space-y-4">
            <div>
                <label for="lab1" class="block text-sm font-medium text-gray-700 mb-1">
                    Lab Practical 1 (out of 100)
                </label>
                <input 
                    type="number" 
                    id="lab1" 
                    min="0" 
                    max="100" 
                    placeholder="e.g., 85"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                >
            </div>

            <div>
                <label for="lab2" class="block text-sm font-medium text-gray-700 mb-1">
                    Lab Practical 2 (out of 100)
                </label>
                <input 
                    type="number" 
                    id="lab2" 
                    min="0" 
                    max="100" 
                    placeholder="e.g., 78"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                >
            </div>

            <div>
                <label for="viva" class="block text-sm font-medium text-gray-700 mb-1">
                    Viva / Oral Exam (out of 100)
                </label>
                <input 
                    type="number" 
                    id="viva" 
                    min="0" 
                    max="100" 
                    placeholder="e.g., 90"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                >
            </div>

            <button 
                onclick="calculateResult()" 
                class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg shadow transition-colors duration-200"
            >
                Calculate Result
            </button>
        </div>

        <div id="result" class="mt-6 text-sm text-gray-700"></div>
    </div>

    <script>
        function calculateResult() {
            let lab1 = Number(document.getElementById("lab1").value);
            let lab2 = Number(document.getElementById("lab2").value);
            let viva = Number(document.getElementById("viva").value);

            // Check marks
            if (lab1 < 0 || lab1 > 100 ||
                lab2 < 0 || lab2 > 100 ||
                viva < 0 || viva > 100) {

                document.getElementById("result").innerHTML =
                    `<div class="p-3 bg-red-50 border border-red-200 text-red-600 rounded-lg font-medium">
                        Please enter marks between 0 and 100.
                     </div>`;
                return;
            }

            // Calculate total and percentage
            let total = lab1 + lab2 + viva;
            let percentage = (total / 300) * 100;

            // Calculate grade
            let grade;

            if (percentage >= 90) {
                grade = "A+ (Excellent)";
            }
            else if (percentage >= 80) {
                grade = "A (Very Good)";
            }
            else if (percentage >= 70) {
                grade = "B (Good)";
            }
            else if (percentage >= 60) {
                grade = "C (Average)";
            }
            else if (percentage >= 50) {
                grade = "D (Pass)";
            }
            else {
                grade = "F (Fail)";
            }

            // Display result
            document.getElementById("result").innerHTML =
                `<div class="p-4 bg-gray-50 border border-gray-200 rounded-lg space-y-2">
                    <div><span class="font-semibold text-gray-900">Total Marks:</span> ${total} / 300</div>
                    <div><span class="font-semibold text-gray-900">Percentage:</span> ${percentage.toFixed(2)}%</div>
                    <div><span class="font-semibold text-gray-900">Grade:</span> <span class="text-blue-600 font-bold">${grade}</span></div>
                 </div>`;
        }
    </script>

</body>
</html>
