<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resgistration form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>

   <div class="container">

    <div class="header">
        <div class="logo">
            YOUR<br>LOGO<br>HERE
        </div>

        <div>
            <h1>Student Registration Form</h1>
            <p class="subtitle">
                Fill out the form to apply for the training courses.
                You can consider your application accepted after receiving
                a confirmation email.
            </p>
        </div>
    </div>

    <form>

        <h2>Student Information</h2>

        <div class="row">
            <input type="text" placeholder="First Name" required>
            <input type="text" placeholder="Middle Name">
            <input type="text" placeholder="Last Name" required>
        </div>

        <div class="row">
            <input type="date" required>
            <input type="text" placeholder="Student ID" required>
        </div>

        <h2>Address</h2>

        <div class="row">
            <input type="text" placeholder="Street Address">
        </div>

        <div class="row">
            <input type="text" placeholder="City">
            <input type="text" placeholder="State / Province">
        </div>

        <h2>Contact Information</h2>

        <div class="row">
            <input type="email" placeholder="E-mail">
            <input type="tel" placeholder="Phone Number">
        </div>

        <h2>Courses</h2>

        <button type="button"  class="course-btn">
            + Add New Record
        </button>

        <table>
            <tr>
                <th>Course</th>
                <th>Level</th>
                <th>Language</th>
                <th>Start Date</th>
            </tr>

            <tr>
                <td>
                    <select>
                        <option>C</option>
                        <option>C++</option>
                        <option>Java</option>
                        <option>Python</option>
                        <option>Web Development</option>
                    </select>
                </td>

                <td>
                    <select>
                        <option>Beginner</option>
                        <option>Intermediate</option>
                        <option>Advanced</option>
                    </select>
                </td>

                <td>
                    <input type="text" placeholder="Language">
                </td>

                <td>
                    <input type="date">
                </td>
            </tr>
        </table>

        <textarea placeholder="Comment"></textarea>

        <div class="buttons">
            <input type="button" value="Register" class="submit">
            <input type="button" value="Reset" class="reset">
        </div>

    </form>

</div>
</body>
</html>
